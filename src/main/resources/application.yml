server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: spring-settings
  lifecycle:
    timeout-per-shutdown-phase: 30s
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      lifecycle-management: start-and-stop
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        default_schema: public
  mvc:
    problemdetails:
      enabled: false

springdoc:
  use-fqn: true
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /docs-json
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /docs
    disable-swagger-default-url: true

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}

decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_ENABLE_LOGGING:false}
      multiline: false
      logging: slf4j

logging:
  level:
    root: INFO
    com.example: ${LOGGING_APP_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}
  auth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      issuer: https://kauth.kakao.com
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      state-ttl: ${KAKAO_STATE_TTL:5m}
    session:
      max-per-user: ${AUTH_MAX_SESSIONS_PER_USER:5}
    jwt:
      issuer: ${JWT_ISSUER:https://api.orbit.local}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
      clock-skew: ${JWT_CLOCK_SKEW:30s}
      secret: ${JWT_SECRET}
