server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  application:
    name: spring-settings
  lifecycle:
    timeout-per-shutdown-phase: 30s
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      lifecycle-management: start-and-stop
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        default_schema: public
  mvc:
    problemdetails:
      enabled: false

springdoc:
  use-fqn: true
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /docs-json
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /docs
    disable-swagger-default-url: true

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}

decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_ENABLE_LOGGING:false}
      multiline: false
      logging: slf4j

logging:
  level:
    root: INFO
    com.example: ${LOGGING_APP_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

app:
  auth:
    token:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:spring-settings}
      access-audience: ${JWT_ACCESS_AUDIENCE:api}
      refresh-audience: ${JWT_REFRESH_AUDIENCE:refresh}
      access-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-ttl: ${JWT_REFRESH_TTL:14d}
      clock-skew: ${JWT_CLOCK_SKEW:0s}
    refresh-store:
      key-prefix: ${REFRESH_KEY_PREFIX:auth:refresh:}
    kakao:
      app-id: ${KAKAO_APP_ID}
      token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
      user-info-uri: https://kapi.kakao.com/v2/user/me
      connect-timeout: ${KAKAO_CONNECT_TIMEOUT:2s}
      read-timeout: ${KAKAO_READ_TIMEOUT:3s}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}
